<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Fish Body Gradient -->
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Fish Fin Gradient -->
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Water Splash Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.5" />
    </linearGradient>

    <!-- Gloss Overlay -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#030712" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Base Shape (Squircle 512x512 with 112px radius) -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" />

  <!-- Glossy Reflection Accent -->
  <path d="M 0 112 C 0 50 50 0 112 0 L 400 0 C 462 0 512 50 512 112 L 512 200 C 300 280 150 200 0 112 Z" fill="url(#glossGrad)" />

  <!-- Water Wave / Splash Layers -->
  <g filter="url(#dropShadow)">
    <!-- Water Layer 1 -->
    <path d="M 40 370 Q 140 330 256 370 T 472 370 L 472 430 Q 350 460 256 420 T 40 430 Z" fill="url(#waterGrad)" />

    <!-- Water Splash Bubbles -->
    <circle cx="160" cy="340" r="10" fill="#7dd3fc" opacity="0.8" />
    <circle cx="180" cy="315" r="7" fill="#bae6fd" opacity="0.9" />
    <circle cx="350" cy="330" r="12" fill="#7dd3fc" opacity="0.8" />
    <circle cx="330" cy="300" r="8" fill="#bae6fd" opacity="0.9" />

    <!-- Main Fish (Leaping Curve) -->
    <!-- Fish Tail -->
    <path d="M 110 330 C 70 360 50 380 40 395 C 65 370 85 350 100 345 C 75 330 55 310 45 295 C 65 315 85 325 110 330 Z" fill="url(#finGrad)" />

    <!-- Fish Back Fin (Dorsal) -->
    <path d="M 210 160 Q 260 110 310 145 C 270 165 240 180 210 160 Z" fill="url(#finGrad)" />

    <!-- Fish Main Body -->
    <path d="M 95 330 C 130 250 210 160 340 170 C 420 180 445 240 430 270 C 370 340 230 380 95 330 Z" fill="url(#fishGrad)" />

    <!-- Fish Belly Highlight Layer -->
    <path d="M 125 330 C 180 360 280 365 390 285 C 360 320 250 365 125 330 Z" fill="#fef08a" opacity="0.7" />

    <!-- Fish Side Fin (Pectoral) -->
    <path d="M 260 270 C 230 310 200 330 180 335 C 205 315 230 295 260 270 Z" fill="url(#finGrad)" />

    <!-- Fish Gills Curve -->
    <path d="M 345 205 Q 330 235 340 265" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round" opacity="0.6" />

    <!-- Fish Eye -->
    <circle cx="385" cy="215" r="16" fill="#ffffff" />
    <circle cx="388" cy="215" r="9" fill="#0f172a" />
    <circle cx="391" cy="212" r="3" fill="#ffffff" />

    <!-- Fish Mouth Curve -->
    <path d="M 430 250 Q 420 258 410 252" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
